<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Noto Naskh Arabic";
    src: url("{{ font_path }}");
  }

  @page {
    size: {{ page_width_in }}in {{ page_height_in }}in;
    margin: 0;
  }

  html, body {
    margin: 0;
    padding: 0;
  }

  .page {
    position: relative;
    width: {{ page_width_in }}in;
    height: {{ page_height_in }}in;
    overflow: hidden;
  }

  .bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Text safe zone: inset from the trim edge so nothing gets cut or
     crowds the trim line. A gutter-aware margin table replaces this
     flat inset in milestone 2. */
  .text-safe-zone {
    position: absolute;
    top: {{ safe_margin_in }}in;
    left: {{ safe_margin_in }}in;
    width: {{ safe_zone_width_in }}in;
    height: {{ safe_zone_height_in }}in;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    box-sizing: border-box;
  }

  .story-text {
    direction: rtl;
    unicode-bidi: isolate;
    font-family: "Noto Naskh Arabic", sans-serif;
    font-size: 28pt;
    line-height: 1.7;
    text-align: right;
    color: #1a1a1a;
    background: rgba(255, 255, 255, 0.85);
    padding: 0.2in 0.35in;
    border-radius: 14px;
    max-width: 92%;
  }
</style>
</head>
<body>
  <div class="page">
    <img class="bg" src="{{ image_path }}" alt="">
    <div class="text-safe-zone">
      <p class="story-text">{{ text_ar }}</p>
    </div>
  </div>
</body>
</html>
