<!DOCTYPE html>
<html lang="{{ language }}">
<head>
<meta charset="utf-8">
<style>
  @page {
    size: {{ cover_width_in }}in {{ cover_height_in }}in;
    margin: 0;
  }

  html, body {
    margin: 0;
    padding: 0;
  }

  .cover {
    position: relative;
    width: {{ cover_width_in }}in;
    height: {{ cover_height_in }}in;
    overflow: hidden;
  }

  .bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Opt-in title/author overlay, drawn on the front (rightmost) panel.
     Only rendered when the author set cover_title_text/cover_author_text.
     Opaque white text with a solid dark outline shadow -- no rgba() alpha
     anywhere (KDP rejects unflattened transparency). */
  .cover-text {
    position: absolute;
    top: {{ cover_text_top_in }}in;
    right: {{ cover_text_right_in }}in;
    width: {{ cover_text_width_in }}in;
    text-align: center;
    direction: rtl;
    color: #ffffff;
    font-family: "Noto Naskh Arabic", serif;
    text-shadow: 0.02in 0.02in 0 #1a1a1a, -0.02in 0.02in 0 #1a1a1a,
                 0.02in -0.02in 0 #1a1a1a, -0.02in -0.02in 0 #1a1a1a;
  }

  /* English books: LTR overlay in a Latin serif face. */
  .lang-en .cover-text {
    direction: ltr;
    font-family: "DejaVu Serif", serif;
  }

  .cover-title {
    font-size: 0.42in;
    font-weight: 700;
    line-height: 1.3;
    margin: 0;
  }

  .cover-author {
    font-size: 0.22in;
    font-weight: 400;
    line-height: 1.3;
    margin: 0.08in 0 0;
  }
</style>
</head>
<body>
  <div class="cover{{ ' lang-en' if language == 'en' else '' }}">
    <img class="bg" src="{{ image_data_uri }}" alt="">
    {% if cover_title_text or cover_author_text %}
    <div class="cover-text">
      {% if cover_title_text %}
      <p class="cover-title">{{ cover_title_text }}</p>
      {% endif %}
      {% if cover_author_text %}
      <p class="cover-author">{{ cover_author_text }}</p>
      {% endif %}
    </div>
    {% endif %}
  </div>
</body>
</html>
