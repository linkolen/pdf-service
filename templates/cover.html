<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Noto Naskh Arabic";
    src: url("{{ font_path }}");
  }

  @page {
    size: {{ cover_width_in }}in {{ cover_height_in }}in;
    margin: 0;
  }

  html, body {
    margin: 0;
    padding: 0;
  }

  .cover {
    position: relative;
    width: {{ cover_width_in }}in;
    height: {{ cover_height_in }}in;
    overflow: hidden;
  }

  .bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Front cover is the rightmost panel of the flattened back|spine|front
     spread (see compose.compose_cover) -- title lives in its safe zone,
     clear of the outer bleed and the spine fold. */
  .front-panel-safe-zone {
    position: absolute;
    top: {{ safe_margin_in }}in;
    right: {{ safe_margin_in }}in;
    width: {{ front_panel_width_in - 2 * safe_margin_in }}in;
    height: {{ cover_height_in - 2 * safe_margin_in }}in;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    box-sizing: border-box;
  }

  .title-text {
    direction: rtl;
    unicode-bidi: isolate;
    font-family: "Noto Naskh Arabic", sans-serif;
    font-size: 40pt;
    font-weight: 700;
    line-height: 1.4;
    text-align: center;
    color: #1a1a1a;
    background: rgba(255, 255, 255, 0.85);
    padding: 0.25in 0.35in;
    border-radius: 14px;
    max-width: 100%;
  }
</style>
</head>
<body>
  <div class="cover">
    <img class="bg" src="{{ image_data_uri }}" alt="">
    <div class="front-panel-safe-zone">
      <p class="title-text">{{ title_ar }}</p>
    </div>
  </div>
</body>
</html>
